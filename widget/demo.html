<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwind Outfitters (demo storefront)</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff; color: #0f172a; min-height: 100vh; }
    header { padding: 22px 6vw; display: flex; justify-content: space-between; align-items: center; }
    header b { font-size: 20px; letter-spacing: .5px; }
    nav a { margin-left: 22px; color: #475569; text-decoration: none; font-size: 14px; }
    main { padding: 8vh 6vw; max-width: 760px; }
    h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.05; margin: 0 0 18px; }
    p { color: #64748b; font-size: 18px; line-height: 1.6; }
    .note { margin-top: 36px; padding: 16px 20px; border: 1px solid #bfdbfe; border-radius: 12px; background: #eff6ff; font-size: 14px; color: #1e40af; }
    code { background: #dbeafe; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <header><b>&#9968; NORTHWIND</b><nav><a href="#">Tents</a><a href="#">Packs</a><a href="#">Footwear</a><a href="#">Sale</a></nav></header>
  <main>
    <h1>Gear for every trail.</h1>
    <p>This is a demo storefront. The SupportAI chat widget in the corner is added with a single script tag.</p>
    <div class="note">Open this page with <code>/demo-site?bot=YOUR_BOT_ID</code> to load your own bot.</div>
  </main>
  <script>
    var bot = new URLSearchParams(location.search).get("bot");
    if (bot) {
      var s = document.createElement("script");
      s.src = "/widget.js"; s.async = true; s.setAttribute("data-bot-id", bot);
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
